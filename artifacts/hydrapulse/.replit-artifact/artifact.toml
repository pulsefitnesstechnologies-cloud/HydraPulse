kind = "mobile"
previewPath = "/"
title = "HydraPulse"
version = "1.0.0"
id = "artifacts/hydrapulse"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20185

[services.development]
run = "pnpm --filter @workspace/hydrapulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hydrapulse", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hydrapulse", "run", "serve" ]

[services.env]
PORT = "20185"
BASE_PATH = "/"
